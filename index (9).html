<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f3b2d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='52'%3E🌿%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&display=swap">
<title>برنامج شجرة عشيرة السادة البو عبد العلي — النسخة المدمجة المكتملة</title>
<style>
:root{--bg:#f6f4ee;--c:#1f3b2d;--a:#2e7d4f;--l:#cfd8cf}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:#222}
header{background:var(--c);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:9}
header h1{margin:0 0 6px;font-size:18px;cursor:pointer}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input,textarea,button,select{font:inherit;padding:6px 9px;border-radius:7px;border:1px solid #aaa;max-width:100%}
#q{flex:1;min-width:160px}
button{background:var(--a);color:#fff;border:0;cursor:pointer}button.g{background:#6b7b70}button.r{background:#a33}button.y{background:#b8860b}
main{padding:12px 14px;max-width:1500px;margin:auto}
#res{background:#fff;border:1px solid var(--l);border-radius:8px;margin-bottom:10px;display:none;max-height:50vh;overflow:auto}
#res div{padding:7px 12px;border-bottom:1px solid #eee;cursor:pointer}#res div:hover{background:#eef5ee}
small{color:#666}
ul{list-style:none;margin:0;padding-right:20px;border-right:2px solid var(--l)}
.root>ul{border:0;padding:0}
li{margin:4px 0}
.n{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--l);border-radius:8px;padding:4px 10px;cursor:pointer}
.n:hover{border-color:var(--a)}.n b{font-weight:600}
.cnt{font-size:12px;color:#fff;background:#8a9a8f;border-radius:9px;padding:0 7px}
.sel>.n{background:#fff6c9;border-color:#d4b400}
.t{width:16px;color:var(--a);font-weight:700}
.fk>.n{background:#e8f3e8;border-color:#7fb28f}.gp>.n{background:#fdf3d8;border-color:#d9b96a}.ms>.n{background:#fbe3e3;border-color:#d99}
#panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid var(--a);padding:10px 14px;display:none;box-shadow:0 -4px 12px #0003;max-height:50vh;overflow:auto;z-index:8}
#panel .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}#panel input{flex:1;min-width:120px}textarea{width:100%;height:64px}
.two{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1.3fr);gap:14px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--l);border-radius:10px;padding:10px}
.crumb{color:#555;font-size:13px;margin-bottom:6px}.crumb a{color:var(--a);cursor:pointer}
h2{margin:6px 0}
@media print{header,#panel,#res,.noprint{display:none!important}}

.src-tree{direction:rtl;overflow:auto;max-height:72vh;padding:12px;background:#fff;border:1px solid #d5dfd5;border-radius:9px}
.src-tree ul{list-style:none;margin:5px 0;padding:5px 18px 5px 0;border-right:2px solid #cbd5cb}
.src-tree>.src-root{border:0;padding:0;margin:0}
.src-tree li{margin:5px 0;min-width:max-content}
.src-row{display:inline-flex;align-items:center;gap:5px}
.src-toggle{width:23px;height:23px;padding:0;border:1px solid #9caf9c;border-radius:5px;background:#f2f7f1;color:#315b38;font-weight:700;line-height:1;cursor:pointer}
.src-toggle-empty{display:inline-flex;width:23px;height:23px;align-items:center;justify-content:center;color:#91a391}
.src-person{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid #b9c6b9;border-radius:7px;background:#fff;box-shadow:0 2px 4px #0001;font-size:14px;font-weight:700;white-space:nowrap}
.src-level-0{background:#fce7a7;border-color:#c79b27;color:#614400}
.src-level-1{background:#dce9fa;border-color:#8aafd8;color:#173b6d}
.src-level-2{background:#e5dbf8;border-color:#a890ce;color:#43236d}
.src-level-3{background:#d9f0df;border-color:#8fbea0;color:#174e2a}
.src-level-4{background:#fae0e9;border-color:#d69ab0;color:#6b2140}
.src-level-5{background:#f8eccb;border-color:#d4bc72;color:#665016}
.src-ancestors{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.src-ancestors span{border:1px solid #d97706;color:#854d0e;background:#fff8eb;border-radius:15px;padding:3px 9px;font-size:12px}
.merge-note{background:#f0f7f0;border:1px solid #b8d3bd;color:#245b34;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
.alt-note{background:#fff9e8;border:1px solid #e6d39b;color:#72530c;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
.src-hit{background:#fff1a8!important;border:2px solid #b45309!important;scroll-margin:90px}
@media(max-width:800px){.src-tree{max-height:none}.src-person{font-size:13px}}


/* ===== واجهة محسّنة وتجارب عرض حسب الجهاز ===== */
:root{--ui-bg:#f4f6f3;--ui-card:#ffffff;--ui-ink:#172b20;--ui-muted:#65756b;--ui-line:#dce5dd;--ui-accent:#276749;--ui-accent-soft:#e8f4ec;--ui-shadow:0 8px 24px rgba(24,52,35,.07)}
html{scroll-behavior:smooth}body{background:var(--ui-bg);color:var(--ui-ink);line-height:1.55}
header{padding:12px clamp(12px,2vw,28px);box-shadow:0 5px 18px rgba(0,0,0,.12);backdrop-filter:blur(10px)}
header h1{font-size:clamp(16px,1.55vw,21px);letter-spacing:.1px;margin-bottom:10px}
header .bar{align-items:center;gap:8px}
header .bar>input,header .bar>select{min-height:42px;border:1px solid rgba(255,255,255,.23);background:#fff;color:#1e3527}
header .bar>button{min-height:42px;padding:8px 13px;font-weight:650;border-radius:10px;box-shadow:0 2px 5px #0002}
#q{min-width:190px;flex:1 1 230px}
#jump{flex:0 1 210px}
.display-mode-switch{display:flex;align-items:center;gap:4px;padding:4px;background:#173d2b;border:1px solid #456b56;border-radius:12px;flex-wrap:wrap}
.display-mode-switch .mode-label{font-size:12px;color:#d6e8da;padding:0 6px;white-space:nowrap}
.display-mode-switch button{background:transparent;color:#e5f0e8;border:1px solid transparent;border-radius:8px;padding:7px 9px;min-height:34px;font-size:12px;white-space:nowrap}
.display-mode-switch button:hover{background:#ffffff16}
.display-mode-switch button.active{background:#f3f8f3;color:#19432d;border-color:#c8ddcc;font-weight:800;box-shadow:0 2px 5px #0002}
main{max-width:1740px;padding:clamp(10px,1.6vw,22px)}
#view{min-width:0}
#view>.card,#view .card{border:1px solid var(--ui-line);border-radius:16px;background:var(--ui-card);padding:clamp(12px,1.4vw,22px);box-shadow:var(--ui-shadow)}
#view h2{font-size:clamp(19px,2vw,27px);line-height:1.35;color:#183d29;margin:4px 0 12px}
#view p small,.toolbar-hint{color:var(--ui-muted);line-height:1.7}
button{transition:transform .12s ease,filter .12s ease,box-shadow .12s ease}
button:hover{filter:brightness(1.04);box-shadow:0 3px 8px #0002}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7fc59a;outline-offset:2px}
.two{grid-template-columns:minmax(300px,.92fr) minmax(360px,1.08fr);align-items:start;gap:16px}
.two>.card{min-width:0}
.root{max-height:72vh;overflow:auto;padding:4px 3px 8px;overscroll-behavior:contain}
.root ul{padding-right:17px;border-right:2px solid #d8e2d9}
.root .n{min-height:38px;padding:6px 10px;gap:7px;border-radius:10px;background:#fff;box-shadow:0 1px 3px #0000000a;max-width:100%;white-space:normal;text-align:right}
.root .fk>.n{background:#f0f8f1;border-color:#b6d7be}.root .gp>.n{background:#fff8e7;border-color:#e7d5a5}
.root .n b{line-height:1.35}.cnt{background:#738b7b;min-width:33px;text-align:center}
.merge-note,.alt-note{border-radius:12px;padding:11px 13px;line-height:1.7}
.main-chart-toolbar,.branch-chart-toolbar{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;padding:8px 0}
.toolbar-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.main-chart-toolbar button,.branch-chart-toolbar button{min-height:39px;border-radius:9px;padding:7px 11px}
.toolbar-hint{flex:1 1 100%;font-size:12px}
.main-chart-scroll,.branch-chart-scroll{width:100%;height:min(72vh,820px);min-height:400px;border:1px solid #d8e2d9;border-radius:14px;background:linear-gradient(180deg,#fbfdfb,#f4f8f4);padding:14px;overscroll-behavior:contain;touch-action:pan-x pan-y;scrollbar-gutter:stable;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.main-chart-svg,.branch-chart-svg{background:#fff;border:1px solid #edf1ed;box-shadow:0 2px 12px #183d2910}
.main-chart-help,.branch-chart-help{padding:8px 11px;border-radius:10px;background:#f1f7f2;color:#53665a;line-height:1.7}
.main-chart-node,.branch-chart-node{cursor:pointer}
.main-chart-node:focus rect,.branch-chart-node:focus rect{stroke:#0f7a42!important;stroke-width:4!important}
#panel{padding:14px clamp(12px,2vw,24px) calc(14px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0;border-top:4px solid var(--ui-accent);box-shadow:0 -8px 30px #0003;max-height:58dvh}
#panel>div:first-child{font-size:15px;color:#1b432d;margin-bottom:8px}
#panel input,#panel textarea{border:1px solid #cbd8ce;border-radius:10px;padding:10px 12px;min-height:42px}
#panel textarea{min-height:84px}
#panel button{min-height:42px;border-radius:10px;padding:8px 14px}
#res{border-radius:13px;box-shadow:var(--ui-shadow);border-color:var(--ui-line)}
#res div{padding:11px 14px;line-height:1.6}
.crumb{margin:0 0 10px;padding:5px 2px;color:#6b7a70}

/* عرض عمودي: بطاقات متدرجة ومتراصة لتناسب شاشة الهاتف */
.portrait-stage{direction:rtl!important;overflow:visible!important;height:auto!important;max-height:none!important;min-height:0!important;border:0!important;padding:0!important;background:transparent!important;}
.portrait-stage .portrait-canvas{width:100%;min-width:0;min-height:0;display:block}
.portrait-tree{direction:rtl;width:100%;max-width:900px;margin:0 auto;padding:4px 0 18px}
.portrait-tree ul{list-style:none;margin:6px 0 0;padding:6px 17px 3px 0;border-right:2px solid #d2dfd5}
.portrait-tree>.portrait-root{border:0;padding:0;margin:0}
.portrait-item{margin:7px 0;min-width:0}
.portrait-row{display:grid;grid-template-columns:38px minmax(0,1fr);align-items:center;gap:8px;min-width:0}
.portrait-toggle,.portrait-toggle-empty{width:36px;height:36px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#225c38;background:#e8f3eb;border:1px solid #b8d3c0;padding:0;flex:none}
.portrait-toggle:hover{background:#d9eddf}
.portrait-person{width:100%;min-width:0;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:right;white-space:normal;color:#1d3325;background:#fff;border:1px solid #d8e2d9;border-radius:12px;padding:9px 12px;box-shadow:0 2px 7px #183d2910}
.portrait-person:hover{border-color:#75a985;background:#fbfffc}
.portrait-name{font-size:14px;font-weight:800;overflow-wrap:anywhere}
.portrait-meta{font-size:11px;font-weight:600;color:#66786b;background:#f0f5f1;border-radius:20px;padding:3px 8px;white-space:nowrap;flex:none}
.portrait-row.depth-0 .portrait-person{background:#fff2c5;border-color:#d5b75f;color:#634b0a}
.portrait-row.depth-1 .portrait-person{background:#eaf2ff;border-color:#b5c9e6;color:#24476f}
.portrait-row.depth-2 .portrait-person{background:#f2ebff;border-color:#d0bce9;color:#563879}
.portrait-row.depth-3 .portrait-person{background:#e9f7ed;border-color:#b9dcc3;color:#245c36}
.portrait-row.depth-4 .portrait-person{background:#ffedf2;border-color:#e8bdca;color:#78374c}
.portrait-row.depth-5 .portrait-person{background:#fff4df;border-color:#e9d3a5;color:#765514}
.portrait-tree-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 0;color:#5c6f61;font-size:12px}
.portrait-tree-tools button{min-height:36px;border-radius:9px}
.portrait-children[hidden]{display:none!important}


.mode-effective{font-size:10px;color:#d5e5d9;padding:0 6px;white-space:nowrap}
.portrait-only-action{display:none!important}
html[data-layout-mode="phone-portrait"] .portrait-only-action{display:inline-flex!important}
html[data-layout-mode="phone-portrait"] .tree-zoom-action{display:none!important}
html[data-layout-mode="phone-portrait"] .toolbar-hint{font-size:11px}
@media(max-width:640px){.mode-effective{width:100%;text-align:center;padding:2px 0}}

/* معاينة وضع الجهاز على الحاسوب؛ لا تؤثر على بيانات البرنامج */
html[data-layout-mode="phone-portrait"] body{max-width:520px;margin:0 auto;box-shadow:0 0 35px #162d1f16;min-height:100vh;background:#f4f6f3}
html[data-layout-mode="phone-portrait"] header{position:relative;padding:12px}
html[data-layout-mode="phone-portrait"] header .bar{gap:6px}
html[data-layout-mode="phone-portrait"] .display-mode-switch{width:100%;justify-content:center}
html[data-layout-mode="phone-portrait"] main{padding:10px}
html[data-layout-mode="phone-portrait"] .two{grid-template-columns:minmax(0,1fr)}
html[data-layout-mode="phone-portrait"] .main-chart-scroll,html[data-layout-mode="phone-portrait"] .branch-chart-scroll{height:auto;min-height:0}
html[data-layout-mode="phone-landscape"] body{max-width:980px;margin:0 auto;box-shadow:0 0 30px #162d1f12}
html[data-layout-mode="phone-landscape"] .main-chart-scroll,html[data-layout-mode="phone-landscape"] .branch-chart-scroll{height:58vh;min-height:280px}
html[data-layout-mode="phone-landscape"] .two{grid-template-columns:minmax(250px,.8fr) minmax(300px,1.2fr);gap:10px}
html[data-layout-mode="phone-landscape"] .root{max-height:58vh}

@media(max-width:900px){
 main{padding:10px}
 .two{grid-template-columns:minmax(0,1fr)}
 .root{max-height:52vh}
 .main-chart-scroll,.branch-chart-scroll{height:62vh;min-height:340px}
}
@media(max-width:640px){
 header{position:relative;padding:11px 10px}
 header h1{font-size:16px;line-height:1.4}
 header .bar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
 header .bar>#q,header .bar>#jump,header .bar>.display-mode-switch{grid-column:1/-1;width:100%;min-width:0}
 header .bar>button{width:100%;min-width:0;padding:8px 7px;font-size:13px}
 #jump{flex:1 1 auto}
 .display-mode-switch{justify-content:center;gap:3px;padding:4px}
 .display-mode-switch .mode-label{width:100%;text-align:center;padding:1px}
 .display-mode-switch button{flex:1 1 22%;font-size:11px;padding:7px 4px}
 main{padding:9px}
 #view>.card,#view .card{padding:12px;border-radius:14px}
 .two{grid-template-columns:minmax(0,1fr);gap:10px}
 .root{max-height:48vh;padding:2px}
 .root ul{padding-right:12px}
 .root .n{width:100%;align-items:flex-start;flex-wrap:wrap;min-height:42px}
 .root .fk>.n,.root .gp>.n{font-size:13px}
 .main-chart-toolbar,.branch-chart-toolbar{align-items:stretch}
 .toolbar-group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
 .toolbar-group button{width:100%;font-size:12px;padding:7px 5px}
 .toolbar-hint{font-size:11px}
 .main-chart-scroll,.branch-chart-scroll{height:58vh;min-height:300px;padding:7px;border-radius:11px}
 .main-chart-svg,.branch-chart-svg{transform-origin:top left}
 .portrait-tree{padding-top:2px}
 .portrait-tree ul{padding-right:12px}
 .portrait-item{margin:6px 0}
 .portrait-row{grid-template-columns:34px minmax(0,1fr);gap:6px}
 .portrait-toggle,.portrait-toggle-empty{width:32px;height:34px;border-radius:9px}
 .portrait-person{min-height:46px;padding:8px 9px;border-radius:10px}
 .portrait-name{font-size:13px}
 .portrait-meta{font-size:10px;padding:2px 6px}
 #panel{max-height:64dvh;padding:12px 10px calc(12px + env(safe-area-inset-bottom))}
 #panel .row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
 #panel .row input{grid-column:1/-1;width:100%;min-width:0}
 #panel .row button{width:100%;font-size:13px;padding:7px 5px}
 #panel textarea{min-height:88px}
}
@media(max-width:640px) and (orientation:landscape){
 header{padding:7px 10px}
 header h1{font-size:14px;margin-bottom:6px}
 header .bar{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
 header .bar>#q{grid-column:span 2}
 header .bar>#jump{grid-column:span 2}
 header .bar>.display-mode-switch{grid-column:1/-1}
 header .bar>button{min-height:34px;font-size:11px;padding:5px}
 .display-mode-switch .mode-label{width:auto}
 main{padding:7px}
 .two{grid-template-columns:minmax(220px,.8fr) minmax(280px,1.2fr)}
 .main-chart-scroll,.branch-chart-scroll{height:52vh;min-height:230px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media print{.display-mode-switch,.portrait-tree-tools{display:none!important}.portrait-tree{max-width:none}.portrait-children[hidden]{display:block!important}}



/* ===== UI/UX refinement pack ===== */
.search-field{position:relative;display:flex;align-items:center;flex:1 1 270px;min-width:210px;max-width:560px;background:#fff;border:1px solid #d5e1d7;border-radius:12px;box-shadow:0 2px 8px #0000000d;overflow:hidden}
.search-field:focus-within{border-color:#80b391;box-shadow:0 0 0 3px #9dd3ad40}
.search-field #q{width:100%;min-width:0;flex:1;border:0!important;outline:0!important;box-shadow:none!important;background:transparent;color:#1c3927;padding:10px 8px;height:42px}
.search-mark{font-size:25px;color:#4b7658;padding:0 10px 3px 2px;line-height:1}
.clear-search{width:32px;height:32px;min-width:32px;padding:0;margin:0 5px;border-radius:9px;background:#eef4ef;color:#4a6652;font-size:21px;line-height:1}
.clear-search[hidden]{display:none!important}
.history-action{min-width:80px}
.history-action:disabled{opacity:.42;cursor:not-allowed;filter:grayscale(.65);box-shadow:none}
.save-state{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:4px 9px;border-radius:20px;background:#e6f4e9;color:#1f6b38;border:1px solid #bedfc7;font-size:11px;font-weight:750;white-space:nowrap}
.save-state[data-state="warn"]{background:#fff4d9;color:#865d08;border-color:#ead49e}
.save-state[data-state="error"]{background:#fde7e7;color:#9e2525;border-color:#e7b5b5}
#res{position:relative;z-index:12;max-height:min(55vh,520px);overflow:auto}
.search-summary{position:sticky;top:0;background:#edf5ef;color:#315b3b;padding:8px 13px;font-size:12px;font-weight:800;border-bottom:1px solid #d9e6dc}
.search-result{display:flex;width:100%;flex-direction:column;align-items:flex-start;gap:2px;text-align:right;background:#fff;color:#183525;border:0;border-bottom:1px solid #edf1ed;border-radius:0;padding:10px 14px;min-height:0;box-shadow:none}
.search-result:hover,.search-result:focus-visible{background:#f3f9f4;color:#173c27;box-shadow:none}
.result-name{font-size:14px;font-weight:800}.result-tag{font-size:11px;color:#597563}.search-result small{font-size:11px;color:#7b837c;white-space:normal}
.search-empty{padding:16px;color:#6c786f;font-size:13px}
.dashboard-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}
.dashboard-stats article{display:flex;align-items:center;gap:10px;min-width:0;background:linear-gradient(145deg,#fff,#f7faf7);border:1px solid #dce7dd;border-radius:14px;padding:12px 14px;box-shadow:0 3px 12px #183d2908}
.stat-icon{display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex:none;border-radius:12px;background:#e8f3eb;font-size:19px}

<script>
const K='albuabdali_merged_v4',OLD_KEYS=['albuabdali_merged_v3','albuabdali_v2'];
let D=load(),op=new Set(['r']),sel=null,zoom=100,pageModes={};
// إعدادات العرض مستقلة عن بيانات الأنساب، لذلك لا تغيّر أو تستبدل أي بيانات محفوظة.
let displayModePreference='auto',resolvedDisplayMode='desktop';
try{displayModePreference=localStorage.getItem('albuabdali_display_mode')||'auto'}catch(e){}
function resolveDisplayMode(){
 if(displayModePreference!=='auto')return displayModePreference;
 const w=window.innerWidth||document.documentElement.clientWidth||1024;
 const h=window.innerHeight||768;
 if(w<=700 && h>=w)return 'phone-portrait';
 if(w<=980 && w>h)return 'phone-landscape';
 return 'desktop';
}
function displayModeLabel(){return ({'phone-portrait':'جوال عمودي','phone-landscape':'جوال أفقي','desktop':'حاسوب'})[resolvedDisplayMode]||'تلقائي'}
function updateModeSwitch(){
 const box=document.getElementById('displayModeSwitch');if(!box)return;
 box.querySelectorAll('[data-mode]').forEach(b=>{const active=b.dataset.mode===displayModePreference;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active?'true':'false')});
 box.dataset.effective=resolvedDisplayMode;const info=box.querySelector('#modeEffective');if(info)info.textContent='المعاينة: '+displayModeLabel();
}
function applyDisplayMode(redraw=true){
 const previous=resolvedDisplayMode;resolvedDisplayMode=resolveDisplayMode();
 document.documentElement.dataset.layoutMode=resolvedDisplayMode;
 document.documentElement.dataset.modePreference=displayModePreference;
 updateModeSwitch();
 if(redraw && previous!==resolvedDisplayMode){
   if(location.hash==='#/main-tree')drawMainChart(true);
   else if(/^#\/f\//.test(location.hash))drawBranchChart(true);
   else if(location.hash==='#/'||!location.hash)drawMainChart(true);
 }
}

 if(!['auto','phone-portrait','phone-landscape','desktop'].includes(mode))return;
 displayModePreference=mode;try{localStorage.setItem('albuabdali_display_mode',mode)}catch(e){}
 applyDisplayMode(true);
}
let modeResizeTimer=0;
window.addEventListener('resize',()=>{clearTimeout(modeResizeTimer);modeResizeTimer=setTimeout(()=>applyDisplayMode(true),140)});

function isPortraitTreeMode(){return resolvedDisplayMode==='phone-portrait'}
function portraitNodeHtml(node,kind,depth=0){
 const id=kind==='main'?node._id:node.id;const kids=node.children||[];const has=kids.length>0;
 const main=kind==='main';const label=esc(node.name||'بدون اسم');
 const click=main?`mainNodePick('${id}')`:`ppick('${id}')`;
 const domId=main?'src-'+id:'n'+id;
 const initialOpen=depth<2;
 const toggle=has?`<button type="button" class="portrait-toggle" id="pt-toggle-${id}" aria-label="فتح أو طي فروع ${label}" aria-expanded="${initialOpen?'true':'false'}" onclick="portraitToggle('${id}')">${initialOpen?'−':'+'}</button>`:`<span class="portrait-toggle-empty">•</span>`;
 return `<li class="portrait-item" id="${domId}"><div class="portrait-row depth-${depth%7}">${toggle}<button type="button" class="portrait-person" onclick="${click}"><span class="portrait-name">${label}</span><span class="portrait-meta">${has?`${kids.length} أبناء`:'فرع نهائي'}</span></button></div>${has?`<ul class="portrait-children" id="pt-kids-${id}" ${initialOpen?'':'hidden'}>${kids.map(ch=>portraitNodeHtml(ch,kind,depth+1)).join('')}</ul>`:''}</li>`;
}
function portraitTreeHtml(tree,kind){
 return `<div class="portrait-tree-tools noprint"><span>عرض عمودي مخصص للجوال</span><button type="button" class="g" onclick="portraitSetAll('${kind}',true)">فتح الكل</button><button type="button" class="g" onclick="portraitSetAll('${kind}',false)">طي الكل</button></div><div class="portrait-tree"><ul class="portrait-root">${portraitNodeHtml(tree,kind,0)}</ul></div>`;
}
function portraitToggle(id){const ul=document.getElementById('pt-kids-'+id),b=document.getElementById('pt-toggle-'+id);if(!ul||!b)return;ul.hidden=!ul.hidden;b.textContent=ul.hidden?'+':'−';b.setAttribute('aria-expanded',ul.hidden?'false':'true')}
function portraitSetAll(kind,open){
 const stage=document.getElementById(kind==='main'?'mainChartCanvas':'branchChartCanvas');if(!stage)return;
 stage.querySelectorAll('.portrait-children').forEach(ul=>ul.hidden=!open);
 stage.querySelectorAll('.portrait-toggle').forEach(b=>{b.textContent=open?'−':'+';b.setAttribute('aria-expanded',open?'true':'false')});
}

function load(){try{for(const key of [K,...OLD_KEYS]){const s=localStorage.getItem(key);if(s)return JSON.parse(s)}}catch(e){}return JSON.parse(document.getElementById('seed').textContent)}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert('تعذر الحفظ')}}
const N=()=>D.nodes,P=()=>D.persons,esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const uid=()=>'x'+(D.n++)+Date.now().toString(36);
const kn=id=>Object.values(N()).filter(x=>x.p===id),kp=id=>Object.values(P()).filter(x=>x.f===id);
const pc=fk=>Object.values(P()).filter(x=>x.fk===fk).length;
const tot=id=>{const n=N()[id];return n.k==='f'?pc(id):kn(id).reduce((s,c)=>s+tot(c.id),0)};
const cp=id=>kp(id).reduce((s,k)=>s+1+cp(k.id),0);
const lin=id=>{let a=[],x=P()[id];while(x){a.push(x.name);x=P()[x.f]}return a.join(' بن ')};
const npath=id=>{let a=[],x=N()[id];while(x){a.unshift(x);x=N()[x.p]}return a};
const MERGED=JSON.parse(document.getElementById('merge-seed').textContent);
function flattenSourceIntoPersons(fk,tree){let i=0;function walk(node,parent){const id='imp_'+fk+'_'+(++i);P()[id]={id,name:node.name,f:parent,fk,note:''};(node.children||[]).forEach(ch=>walk(ch,id))}walk(tree,null)}
function integrateMergedData(){
 if(D.mergeVersion===1 && D.importedTrees?.pages){if(!D.importedTrees.main)D.importedTrees.main=MERGED.main;save();return;}
 D.importedTrees=MERGED;D.importedPrimary=D.importedPrimary||{};D.legacyPersonsByPage=D.legacyPersonsByPage||{};
 for(const [fk,rec] of Object.entries(MERGED.pages)){
   if(!N()[fk])continue;
   const existing=Object.values(P()).filter(x=>x.fk===fk);
   const root=existing.find(x=>x.f===null);
   const pageLabel=(N()[fk].name.split('—').pop()||N()[fk].name).trim();
   const placeholder=existing.length===0 || (existing.length===1 && root && (root.name===N()[fk].name || root.name===pageLabel || root.name.includes('غير معروف') || root.name.startsWith('بيت السادة (') || root.name.startsWith('البو ')));
   if(placeholder){
     D.legacyPersonsByPage[fk]=existing.map(x=>({...x}));
     existing.forEach(x=>delete P()[x.id]);
     flattenSourceIntoPersons(fk,rec.tree);
     D.importedPrimary[fk]=true;
     N()[fk].has=1;
   }else D.importedPrimary[fk]=false;
 }
 // One source record is explicitly a combined chart for 29-30, not two independent trees.
 if(N().f29){N().f29.name='البو عبد الدرويش الكلية — المشجرتان 29 و30';N().f29.pageRange='29–30';N().f29.sp='130–131';N().f29.has=1;}
 if(N().f30){
   const old30=Object.values(P()).filter(x=>x.fk==='f30');
   const onlyPlaceholder=old30.length===1 && (old30[0].name.includes('غير معروف') || old30[0].name.includes('ناقص'));
   if(onlyPlaceholder){D.legacyPersonsByPage.f30=old30.map(x=>({...x}));old30.forEach(x=>delete P()[x.id]);}
   N().f30.name='الجزء الثاني من المشجرة الجامعة (29–30) — لا توجد شجرة مستقلة بالملف الرقمي';
   N().f30.has=0;
 }
 D.importedRefs={f30:'f29'};
 D.mergeVersion=1;
 D.mergeSummary={sourceRecords:MERGED.sourceRecordCount,mainNodes:MERGED.main.count,sourcePages:Object.keys(MERGED.pages).length,mergedAt:'2026-11-02'};
 save();
}
integrateMergedData();

/*
 * فصل بيانات كل مشجرة عن المخطط الرئيسي:
 * - كل فخذ يملك شجرة مستقلة في P() بمفتاح fk خاص به.
 * - MERGED.pages[fk] هو مصدر ذلك الفخذ فقط، ولا يُستخدم main.tree كبديل لأي فخذ.
 * - نحافظ على بيانات البرنامج القديمة المفصلة ونحفظ نسخة منها قبل أي استبدال.
 */
function ensureIndependentBranchCharts(){
  D.importedTrees=D.importedTrees||{};
  D.importedTrees.pages=D.importedTrees.pages||{};
  for(const [fk,rec] of Object.entries(MERGED.pages||{})){
    if(!D.importedTrees.pages[fk])D.importedTrees.pages[fk]=rec;
  }
  if(!D.importedTrees.main)D.importedTrees.main=MERGED.main;
  D.legacyPersonsByPage=D.legacyPersonsByPage||{};
  D.importedPrimary=D.importedPrimary||{};
  // ألغِ الربط القديم الذي كان يجعل الصفحة 30 تعرض نسخة الصفحة 29 نفسها.
  if(D.importedRefs)delete D.importedRefs.f30;
  D.importedRefs={};

  const mainTree=D.importedTrees.main?.tree||null;
  const mainName=mainTree?.name||'';
  const mainCount=mainTree ? srcCount(mainTree) : -1;
  const structure=(node,includeName=true)=>node?JSON.stringify([includeName?(node.name||''):'ROOT',(node.children||[]).map(ch=>structure(ch,true))]):'';
  function personTreeDataForMigration(fk,all){
    const root=all.find(x=>x.f===null);if(!root)return null;
    const byParent=new Map();for(const p of all){if(!byParent.has(p.f))byParent.set(p.f,[]);byParent.get(p.f).push(p)}
    function build(p){return {name:p.name,children:(byParent.get(p.id)||[]).map(build)}}
    return build(root);
  }
  const mainShape=mainTree?structure(mainTree,false):'';
  for(const [fk,meta] of Object.entries(N())){
    if(meta.k!=='f')continue;
    const rec=D.importedTrees.pages[fk];
    const all=Object.values(P()).filter(x=>x.fk===fk);
    const root=all.find(x=>x.f===null);
    const label=(meta.name.split('—').pop()||meta.name).trim();
    const placeholder=all.length===0 || (all.length===1 && root && (
      root.name===meta.name || root.name===label || /غير معروف|مشجرة ناقصة|لا توجد شجرة/i.test(root.name)
    ));
    const sameAsMain=!!(root && ((root.name===mainName && all.length===mainCount) || structure(personTreeDataForMigration(fk,all),false)===mainShape));
    if((placeholder||sameAsMain) && rec?.tree && fk!=='f30'){
      if(all.length && !D.legacyPersonsByPage[fk])D.legacyPersonsByPage[fk]=all.map(x=>({...x}));
      all.forEach(x=>delete P()[x.id]);
      flattenSourceIntoPersons(fk,rec.tree);
      D.importedPrimary[fk]=true;
      meta.has=1;
      delete meta.chartUnavailable;
    }
  }

  // المصدر المتاح يجمع المشجرتين 29 و30 في مخطط واحد فقط.
  // لا نكرر مخطط 29 على الصفحة 30، ولا نختلق تفاصيل غير موجودة.
  const p30=N().f30;
  if(p30){
    const all30=Object.values(P()).filter(x=>x.fk==='f30');
    const root30=all30.find(x=>x.f===null);
    const isOnlyPlaceholder=all30.length===0 || (all30.length===1 && root30 && /ناقص|غير معروف|مشجرة رقم|مشجرة ناقصة/i.test(root30.name));
    if(isOnlyPlaceholder){
      if(all30.length && !D.legacyPersonsByPage.f30)D.legacyPersonsByPage.f30=all30.map(x=>({...x}));
      all30.forEach(x=>delete P()[x.id]);
      p30.chartUnavailable=true;
      p30.has=0;
    }
  }
  D.branchChartSeparationVersion=2;
  save();
}
ensureIndependentBranchCharts();

function normalizeAllChartIds(){
 const seen=new Set();
 function walk(n,prefix){if(!n)return;if(!n.id)n.id=prefix+'_'+uid();if(seen.has(n.id))n.id=prefix+'_'+uid();seen.add(n.id);(n.children||[]).forEach(c=>walk(c,prefix))}
 for(const [fk,rec] of Object.entries(D.importedTrees?.pages||{}))walk(rec.tree,'src_'+fk);
 if(D.importedTrees?.main?.tree)mainEnsureIds();
}
normalizeAllChartIds();
function srcCount(node){return 1+(node.children||[]).reduce((s,c)=>s+srcCount(c),0)}

function srcTreeHtml(rec){return `<div class="bar noprint" style="margin:6px 0"><button type="button" onclick="srcSetAll(this,true)">فتح كل الفروع</button><button type="button" class="g" onclick="srcSetAll(this,false)">طي كل الفروع</button></div><div class="src-tree"><ul class="src-root">${srcNodeHtml(rec.tree,0)}</ul></div>`}
function srcToggle(id){const ul=document.getElementById('src-kids-'+id),b=document.getElementById('src-toggle-'+id);if(!ul||!b)return;ul.hidden=!ul.hidden;b.textContent=ul.hidden?'+':'−'}
function srcSetAll(btn,open){const box=btn.parentElement.nextElementSibling;if(!box)return;box.querySelectorAll('ul[id^="src-kids-"]').forEach(ul=>ul.hidden=!open);box.querySelectorAll('.src-toggle').forEach(b=>b.textContent=open?'−':'+')}
function srcAncestorsHtml(rec){return rec.ancestors?.length?`<div class="src-ancestors"><b>سلسلة النسب بحسب الملف الرقمي:</b>${rec.ancestors.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}
function sourcePath(rec,target){let result=null;function walk(n,path){if(result)return;const next=[...path,n.name];if(n._id===target){result=next;return}(n.children||[]).forEach(c=>walk(c,next))}walk(rec.tree,[]);return result||[]}
function sourceEntries(rec){const out=[];function walk(n,path){const p=[...path,n.name];out.push({id:n._id,name:n.name,path:p});(n.children||[]).forEach(c=>walk(c,p))}walk(rec.tree,[]);return out}

function mainEnsureIds(){

 const seen=new Set();
 (function walk(n){if(!n._id||seen.has(n._id))n._id='main_'+uid();seen.add(n._id);(n.children||[]).forEach(walk)})(rec.tree);
}

function mainLayout(){
 const root=D.importedTrees.main.tree;const compact=resolvedDisplayMode==='phone-landscape';const leafGap=compact?104:154,levelGap=compact?84:104,pad=compact?58:96,top=compact?34:46;
 let leaf=0,maxDepth=0;const nodes=[],byId={};
 function place(n,depth){
   maxDepth=Math.max(maxDepth,depth);
   const kids=Array.isArray(n.children)?n.children:[];
   const centers=[];
   // أول ابن يظهر جهة اليمين بما يتوافق مع اتجاه المخطط العربي.
   for(const ch of [...kids].reverse())centers.push(place(ch,depth+1));
   const x=centers.length?(Math.min(...centers)+Math.max(...centers))/2:pad+(leaf++)*leafGap;
   const y=top+depth*levelGap;
   const chars=[...String(n.name||'')].length;
   const w=Math.max(94,Math.min(184,chars*10+28));
   const o={id:n._id,name:n.name||'',x,y,w,h:42,depth,node:n};nodes.push(o);byId[o.id]=o;
   return x;
 }
 place(root,0);
 const width=Math.max(460,pad*2+Math.max(0,leaf-1)*leafGap+130);
 const height=top+maxDepth*levelGap+105;
 const edges=[];
 for(const o of nodes){for(const ch of (o.node.children||[])){const c=byId[ch._id];if(c)edges.push({p:o,c})}}
 return {nodes,edges,byId,width,height,leafCount:leaf,maxDepth};
}

let undoStack=[], redoStack=[], historyBusy=false, lastSavedSnapshot=JSON.stringify(D), toastTimer=null;
const MAX_HISTORY=25;
function setSaveBadge(text,kind='ok'){
 const b=document.getElementById('saveState'); if(!b)return;
 b.textContent=text; b.dataset.state=kind;
}
function showToast(message,kind='ok'){

function updateHistoryButtons(){
 const u=document.getElementById('undoBtn'),r=document.getElementById('redoBtn');
 if(u){u.disabled=!undoStack.length;u.title=undoStack.length?`تراجع عن آخر تعديل (${undoStack.length})`:'لا توجد تعديلات للتراجع عنها'}
 if(r){r.disabled=!redoStack.length;r.title=redoStack.length?`إعادة آخر تعديل (${redoStack.length})`:'لا توجد تعديلات لإعادتها'}
}
// Replace the original save routine with one that records a small in-memory undo/redo history.
save=function(){
 let snap;
 try{snap=JSON.stringify(D)}catch(e){setSaveBadge('تعذّر تجهيز البيانات للحفظ','error');return false}
 if(!historyBusy && lastSavedSnapshot && snap!==lastSavedSnapshot){
   undoStack.push(lastSavedSnapshot); if(undoStack.length>MAX_HISTORY)undoStack.shift(); redoStack=[];
 }
 try{localStorage.setItem(K,snap);lastSavedSnapshot=snap;setSaveBadge('✓ تم الحفظ تلقائياً','ok');updateHistoryButtons();return true}
 catch(e){lastSavedSnapshot=snap;setSaveBadge('⚠ التخزين المحلي غير متاح — نزّل نسخة','warn');updateHistoryButtons();return false}
};
function applyHistorySnapshot(target,other,label){
 if(!target.length){showToast(label==='undo'?'ماكو تعديل سابق للتراجع':'ماكو تعديل لاحق للإعادة','warn');return}
 const current=JSON.stringify(D), snap=target.pop(); other.push(current);
 historyBusy=true;
 try{
   D=JSON.parse(snap); const normalized=JSON.stringify(D);
   try{localStorage.setItem(K,normalized)}catch(e){}
   lastSavedSnapshot=normalized;
 }catch(e){showToast('تعذر استرجاع الحالة السابقة','error');historyBusy=false;return}
 historyBusy=false;fill();route();updateHistoryButtons();
 showToast(label==='undo'?'تم التراجع عن آخر تعديل':'تمت إعادة التعديل','ok');
}
function undoChange(){applyHistorySnapshot(undoStack,redoStack,'undo')}
function redoChange(){applyHistorySnapshot(redoStack,undoStack,'redo')}
function resetHistory(){undoStack=[];redoStack=[];lastSavedSnapshot=JSON.stringify(D);updateHistoryButtons()}

// Better Arabic-aware search: normalizes hamza/alef, yaa, taa marbuta and diacritics.
function normalizeArabicSearch(value){
 return String(value||'').toLocaleLowerCase('ar')
  .normalize('NFD').replace(/[\u064B-\u065F\u0670\u0640]/g,'')
  .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').trim();
}

 for(const person of Object.values(P())){

   }
 }
 for(const entry of sourceEntries(D.importedTrees.main)){
   if(normalizeArabicSearch(entry.name).includes(qv))

 }
 // Also include digital source-page records that may not have been flattened into the editable-person table.
 for(const page of Object.values(N()).filter(x=>x.k==='f')){
   if(normalizeArabicSearch(page.name).includes(qv))
     add('f:'+page.id,`<button type="button" class="search-result" role="option" onclick="location.hash='#/f/${page.id}'"><span class="result-name">${esc(page.name)}</span><span class="result-tag">فتح المشجرة ${esc(page.pageRange||page.pg)}</span><small>صفحة فخذ من الهيكل العام</small></button>`);
 }

/* ---------------------------------------------------------- تحسين البحث */
function hlRegex(raw){
  const q=normalizeArabicSearch(raw);if(!q)return null;
  const map={'ا':'[اأإآٱ]','ي':'[يىئ]','ه':'[هة]','و':'[وؤ]'};
  const dia='[\\u064B-\\u065F\\u0670\\u0640]*';
  const parts=Array.from(q).map(ch=>{
    if(/\s/.test(ch))return '\\s+';
    return (map[ch]||ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'))+dia;
  });
  return new RegExp(parts.join(''),'i');
}
function highlightResults(raw){
  const box=document.getElementById('res');if(!box)return;
  const items=$$('.search-result',box);if(!items.length)return;
  let re=null;try{re=hlRegex(raw)}catch(e){}
  items.forEach((it,i)=>{
    it.id='ux-res-'+i;it.setAttribute('aria-selected','false');
    if(!re)return;
    const nm=$('.result-name',it);if(!nm)return;
    const txt=nm.textContent,m=re.exec(txt);if(!m||!m[0])return;
    nm.textContent='';nm.appendChild(document.createTextNode(txt.slice(0,m.index)));
    const mk=document.createElement('mark');mk.textContent=m[0];nm.appendChild(mk);
    nm.appendChild(document.createTextNode(txt.slice(m.index+m[0].length)));
  });
}

/* ---------------- إيماءات المخطط: سحب بالماوس، Ctrl+عجلة، قرص بإصبعين */
function zoomAt(sc,nz,cx,cy){
  const isMain=sc.classList.contains('main-chart-scroll');
  const lim=isMain?[.10,1.7]:[.25,1.8];
  const old=isMain?mainChartZoom:branchChartZoom;
  nz=Math.max(lim[0],Math.min(lim[1],nz));
  if(!isFinite(nz)||Math.abs(nz-old)<.002)return;
  const svg=sc.querySelector('svg.main-chart-svg,svg.branch-chart-svg');if(!svg)return;
  const vb=svg.viewBox&&svg.viewBox.baseVal;if(!vb||!vb.width)return;
  const r=sc.getBoundingClientRect(),cs=getComputedStyle(sc);
  const padL=parseFloat(cs.paddingLeft)||0,padT=parseFloat(cs.paddingTop)||0;
  const px=cx-r.left,py=cy-r.top,ratio=nz/old;
  const ox=sc.scrollLeft+px-padL,oy=sc.scrollTop+py-padT;
  if(isMain)mainChartZoom=nz;else branchChartZoom=nz;
  svg.setAttribute('width',Math.round(vb.width*nz));svg.setAttribute('height',Math.round(vb.height*nz));
  sc.scrollLeft=ox*ratio+padL-px;sc.scrollTop=oy*ratio+padT-py;
  syncBadges();
}
function bindGestures(sc){
  if(sc.dataset.uxBound)return;sc.dataset.uxBound='1';
  const isMain=sc.classList.contains('main-chart-scroll');
  const zget=()=>isMain?mainChartZoom:branchChartZoom;
  const portrait=()=>sc.classList.contains('portrait-stage');
  sc.addEventListener('wheel',e=>{
    if(!(e.ctrlKey||e.metaKey)||portrait())return;
    e.preventDefault();
    zoomAt(sc,zget()*Math.exp(-e.deltaY*(e.deltaMode===1?.05:.0022)),e.clientX,e.clientY);
  },{passive:false});
  let drag=null,moved=false;
  sc.addEventListener('pointerdown',e=>{
    moved=false;
    if(e.pointerType!=='mouse'||e.button!==0||portrait())return;
    drag={x:e.clientX,y:e.clientY,l:sc.scrollLeft,t:sc.scrollTop,id:e.pointerId};
  });
  sc.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!moved&&Math.hypot(dx,dy)>5){moved=true;sc.classList.add('ux-grabbing');try{sc.setPointerCapture(drag.id)}catch(_){}}
    if(moved){sc.scrollLeft=drag.l-dx;sc.scrollTop=drag.t-dy}
  });
  const end=e=>{
    if(!drag)return;drag=null;sc.classList.remove('ux-grabbing');
    try{sc.releasePointerCapture(e.pointerId)}catch(_){}
  };
  sc.addEventListener('pointerup',end);sc.addEventListener('pointercancel',end);
  sc.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
  let pin=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  sc.addEventListener('touchstart',e=>{if(e.touches.length===2&&!portrait())pin={d:dist(e.touches)||1,z:zget()}},{passive:true});
  sc.addEventListener('touchmove',e=>{
    if(!pin||e.touches.length!==2)return;e.preventDefault();
    zoomAt(sc,pin.z*dist(e.touches)/pin.d,(e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2);
  },{passive:false});
  sc.addEventListener('touchend',e=>{if(e.touches.length<2)pin=null});
}

function enhanceRows(){

function rowKey(r){return r.getAttribute('onclick')}
function findRow(key){return $$('#view .root .n').find(r=>rowKey(r)===key)||null}
function withRowFocus(row,fn){
  const key=rowKey(row);fn();

}
function childRow(li){
  const ul=Array.from(li.children).find(c=>c.tagName==='UL');
  const first=ul&&ul.querySelector(':scope > li');
  return first?Array.from(first.children).find(c=>c.classList.contains('n')):null;

viewEl.addEventListener('keydown',e=>{
  const gear=e.target.closest&&e.target.closest('.ux-gear');
  if(gear&&(e.key==='Enter'||e.key===' ')){e.preventDefault();gear.click();return}
  const row=e.target;
  if(!row||!row.classList||!row.classList.contains('n')||!row.closest('.root'))return;
  const rows=$$('#view .root .n'),i=rows.indexOf(row),li=row.parentElement;
  const expanded=row.getAttribute('aria-expanded');
  switch(e.key){
    case 'ArrowDown':e.preventDefault();if(rows[i+1])rows[i+1].focus();break;
    case 'ArrowUp':e.preventDefault();if(rows[i-1])rows[i-1].focus();break;
    case 'Home':e.preventDefault();rows[0]&&rows[0].focus();break;
    case 'End':e.preventDefault();rows[rows.length-1]&&rows[rows.length-1].focus();break;
    case 'Enter':case ' ':e.preventDefault();row.click();break;
    case 'ArrowLeft':{ // فتح (اتجاه RTL)
      e.preventDefault();
      if(expanded==='false'){const t=$('.t',row);if(t)withRowFocus(row,()=>t.click())}
      else if(expanded==='true'){const c=childRow(li);if(c)c.focus()}
      break;}
    case 'ArrowRight':{ // طي، أو الصعود للأب
      e.preventDefault();
      if(expanded==='true'){const t=$('.t',row);if(t)withRowFocus(row,()=>t.click())}
      else{
        const pli=li.parentElement&&li.parentElement.closest('li');
        const p=pli&&Array.from(pli.children).find(c=>c.classList.contains('n'));
        if(p)p.focus();
      }
      break;}
  }
});

function rememberFocus(){

  returnFocus={el:a,id:a.id||'',key:a.getAttribute&&a.getAttribute('onclick')};
}
function resolveFocus(rf){
  if(!rf)return null;
  if(rf.el&&rf.el.isConnected)return rf.el;
  if(rf.id){const e=document.getElementById(rf.id);if(e)return e}
  if(rf.key){const e=$$('#view [onclick]').find(x=>x.getAttribute('onclick')===rf.key);if(e)return e}

}

}

panelEl.addEventListener('keydown',e=>{
